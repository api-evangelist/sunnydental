name: Sai De Yang Guang Oral Care
description: Sai De Yang Guang Oral Care (赛德阳光口腔) is a dental healthcare chain operating
  across China, founded in 2007 by orthodontist Zhou Yanheng, formerly a director at Peking
  University School of Stomatology. It runs roughly 30 clinics across major cities including
  Beijing, Shanghai, Guangzhou, Shenzhen, Chengdu, Xiamen, Xi'an, Tianjin, Shenyang and
  Changsha, with nearly 340 treatment chairs, and provides orthodontics (including Invisalign),
  dental implants, pediatric dentistry, cosmetic dentistry and periodontal treatment. It is a
  portfolio company of Qiming Venture Partners. The company operates a patient-facing website
  (appointment booking, clinic locations, expert profiles) and publishes no public API or
  developer program.
